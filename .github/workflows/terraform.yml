name: "Terraform CI/CD"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: "Terraform Execution"
    runs-on: ubuntu-latest
    
    # Tells GitHub to execute all steps inside your specific subfolder
    defaults:
      run:
        working-directory: ./infra/infra

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install the exact Terraform version needed
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # 3. Check for formatting errors (Fails if code is messy)
      - name: Terraform Format Check
        run: terraform fmt -check

      # 4. Initialize the workspace (Connects to S3 Remote Backend)
      - name: Terraform Init
        run: terraform init

      # 5. Check for structural/logic configuration errors
      - name: Terraform Validate
        run: terraform validate

      # 6. Generate an execution plan on Pull Requests
      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      # 7. Automatically apply changes ONLY when code merges to main
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

